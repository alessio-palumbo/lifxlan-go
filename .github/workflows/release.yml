name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Existing semantic-version tag to build and release
        required: true
        type: string

env:
  VERSION: ${{ inputs.version || github.ref_name }}
  BENCHSTAT_VERSION: v0.0.0-20260908200009-22c9c6c9d4da

permissions:
  contents: read

jobs:
  benchmark:
    name: Benchmark release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.VERSION }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Find previous release
        id: previous
        shell: bash
        run: |
          previous_version="$(git describe --tags --abbrev=0 "${VERSION}^" 2>/dev/null || true)"
          echo "version=$previous_version" >> "$GITHUB_OUTPUT"

      - name: Benchmark current release
        shell: bash
        run: |
          mkdir -p benchmark-dist
          go test -run '^$' \
            -bench 'Benchmark(DeviceClone|ControllerGetDevices|ControllerGetDevicesParallel|SubscribeDevices|DeviceEventFanout|DeviceEventSSE)$' \
            -benchmem -benchtime=500ms -count=10 \
            ./pkg/device ./pkg/controller ./internal/httpapi \
            > benchmark-dist/current.txt

      - name: Benchmark previous release
        if: steps.previous.outputs.version != ''
        shell: bash
        env:
          PREVIOUS_VERSION: ${{ steps.previous.outputs.version }}
        run: |
          previous_dir="$RUNNER_TEMP/lifxlan-go-previous"
          git worktree add --detach "$previous_dir" "$PREVIOUS_VERSION"
          cd "$previous_dir"
          go test -run '^$' \
            -bench 'Benchmark(DeviceClone|ControllerGetDevices|ControllerGetDevicesParallel|SubscribeDevices|DeviceEventFanout|DeviceEventSSE)$' \
            -benchmem -benchtime=500ms -count=10 \
            ./pkg/device ./pkg/controller ./internal/httpapi \
            > "$GITHUB_WORKSPACE/benchmark-dist/previous.txt"

      - name: Compare releases
        shell: bash
        env:
          PREVIOUS_VERSION: ${{ steps.previous.outputs.version }}
        run: |
          go install "golang.org/x/perf/cmd/benchstat@${BENCHSTAT_VERSION}"
          benchstat="$(go env GOPATH)/bin/benchstat"
          if [[ -n "$PREVIOUS_VERSION" ]]; then
            "$benchstat" \
              "$PREVIOUS_VERSION=benchmark-dist/previous.txt" \
              "$VERSION=benchmark-dist/current.txt" \
              > benchmark-dist/comparison.txt
          else
            "$benchstat" "$VERSION=benchmark-dist/current.txt" \
              > benchmark-dist/comparison.txt
          fi

      - name: Build benchmark report
        shell: bash
        env:
          PREVIOUS_VERSION: ${{ steps.previous.outputs.version }}
        run: |
          report="benchmark-dist/lifxlan-go_${VERSION}_benchmarks.md"
          raw="benchmark-dist/lifxlan-go_${VERSION}_benchmarks.txt"
          mv benchmark-dist/current.txt "$raw"

          {
            echo "# lifxlan-go ${VERSION} benchmarks"
            echo
            echo "These results measure in-memory device cloning, controller snapshots,"
            echo "subscription initialization, device-event fan-out, and HTTP Server-Sent"
            echo "Event encoding. They do not"
            echo "measure LAN discovery, Wi-Fi latency, or physical device response time."
            echo
            echo "## Environment"
            echo
            echo "- Runner: GitHub Actions \`ubuntu-latest\`"
            echo "- Architecture: $(go env GOARCH)"
            echo "- Logical CPUs: $(getconf _NPROCESSORS_ONLN)"
            echo "- CPU: $(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -n 1)"
            echo "- Go: $(go version)"
            echo "- benchstat: ${BENCHSTAT_VERSION}"
            echo "- Samples: 10 at 500ms minimum benchmark time"
            echo
            echo "## Comparison"
            echo
            if [[ -n "$PREVIOUS_VERSION" ]]; then
              echo "The previous release is ${PREVIOUS_VERSION}. A row present in only one"
              echo "release was added or removed between those releases."
            else
              echo "No previous reachable release tag was found."
            fi
            echo
            echo '```text'
            cat benchmark-dist/comparison.txt
            echo '```'
            echo
            echo "Interpret small timing changes cautiously: hosted runners vary. Allocation"
            echo "changes are generally more reproducible, and large statistically significant"
            echo "timing changes are more informative than small deltas."
          } > "$report"

          cat "$report" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: lifxlan-go-benchmarks
          path: |
            benchmark-dist/lifxlan-go_*_benchmarks.md
            benchmark-dist/lifxlan-go_*_benchmarks.txt
            benchmark-dist/previous.txt
            benchmark-dist/comparison.txt
          if-no-files-found: error
          retention-days: 90

  build:
    name: Build release archives
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.VERSION }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Import Developer ID certificate
        shell: bash
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/lifxlan-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          printf '%s' "$MACOS_CERTIFICATE_BASE64" | /usr/bin/base64 -D > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          SIGNING_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' \
            | head -n 1)"
          if [[ -z "$SIGNING_IDENTITY" ]]; then
            echo "no Developer ID Application identity found" >&2
            exit 1
          fi
          echo "MACOS_SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"

      - name: Validate release tag
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "invalid semantic version tag: $VERSION" >&2
            exit 1
          fi

      - name: Test
        run: go test ./...

      - name: Build and package
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p dist

          while read -r goos goarch goarm label; do
            archive="lifxland_${VERSION}_${goos}_${label}"
            staging_root="$(mktemp -d)"
            package_dir="${staging_root}/${archive}"
            mkdir -p "${package_dir}/api" "${package_dir}/docs" "${package_dir}/examples/http/python"

            binary="${package_dir}/lifxland"
            if [[ "$goos" == "windows" ]]; then
              binary="${binary}.exe"
            fi

            build_env=(env CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch")
            if [[ "$goarm" != "none" ]]; then
              build_env+=(GOARM="$goarm")
            fi
            "${build_env[@]}" go build \
              -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o "$binary" \
              ./cmd/lifxland

            if [[ "$goos" == "darwin" ]]; then
              codesign --force --options runtime --timestamp \
                --identifier com.alessiopalumbo.lifxland \
                --sign "$MACOS_SIGNING_IDENTITY" \
                "$binary"
              codesign --verify --strict --verbose=2 "$binary"
            fi

            cp LICENSE README.md "${package_dir}/"
            cp api/openapi.yaml "${package_dir}/api/"
            cp docs/http-api.md "${package_dir}/docs/"
            cp examples/http/python/client.py "${package_dir}/examples/http/python/"

            if [[ "$goos" == "windows" || "$goos" == "darwin" ]]; then
              (cd "$staging_root" && zip -qr "${GITHUB_WORKSPACE}/dist/${archive}.zip" "$archive")
            else
              tar -C "$staging_root" -czf "dist/${archive}.tar.gz" "$archive"
            fi
          done <<'TARGETS'
          darwin amd64 none amd64
          darwin arm64 none arm64
          linux amd64 none amd64
          linux arm64 none arm64
          linux arm 7 armv7
          windows amd64 none amd64
          TARGETS

          # Apple issues an online notarization ticket for each signed binary in
          # these ZIPs. ZIP archives and bare executables cannot be stapled.
          for archive in dist/lifxland_*_darwin_*.zip; do
            xcrun notarytool submit "$archive" \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --wait
          done

          (cd dist && shasum -a 256 lifxland_* > SHA256SUMS)

      - name: Upload release archives
        uses: actions/upload-artifact@v4
        with:
          name: lifxland-release
          path: dist/
          if-no-files-found: error
          retention-days: 1

  release:
    name: Create draft release
    needs: [build, benchmark]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          name: lifxland-release
          path: dist

      - name: Download benchmark report
        uses: actions/download-artifact@v4
        with:
          name: lifxlan-go-benchmarks
          path: benchmark-results

      - name: Add benchmark report to release assets
        run: cp benchmark-results/lifxlan-go_*_benchmarks.* dist/

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$VERSION" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$VERSION" dist/* --clobber --repo "$GH_REPO"
          else
            gh release create "$VERSION" dist/* \
              --draft \
              --generate-notes \
              --repo "$GH_REPO" \
              --title "lifxlan-go $VERSION" \
              --verify-tag
          fi
